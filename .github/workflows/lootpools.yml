name: Update loot pools

# Lootrun pools reset every Friday at 2 PM New York time (19:00 UTC in winter,
# 18:00 UTC during daylight saving time). GitHub often skips scheduled runs, so
# several Friday runs start in the hours before the reset, and the script's
# --wait mode keeps polling until the new pools appear. Only one of them has to
# actually start; later ones see the pools are current and exit. The 6-hourly
# run is a safety net for mid-week changes. The script only commits when the
# pools change.
on:
  schedule:
    - cron: '7,37 16,17,18,19 * * 5'
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lootpools
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # --wait polls for up to ~4.5 hours.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Fetch loot pools
        run: python3 scripts/update_lootpools.py --wait
        env:
          # Optional: shiny trackers come from Wynnventory's pool data.
          WYNNVENTORY_API_KEY: ${{ secrets.WYNNVENTORY_API_KEY }}

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/lootpools.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lootpools.json
          git commit -m "Update loot pools"
          git pull --rebase
          git push
